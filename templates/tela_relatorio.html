<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatório</title>

    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --border: #dce1e7;
            --text: #1e293b;
            --text-light: #64748b;
            --radius: 8px;
            --shadow: 0 3px 10px rgba(0,0,0,0.12);
            --font: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: var(--font);
            background: var(--bg-light);
            color: var(--text);
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 90vh;
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 1400px;
            margin: auto;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 22px;
            color: var(--primary-dark);
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .filters label {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 600;
        }

        .filters input, .filters select {
            width: 100%;
            margin-top: 4px;
            padding: 8px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            font-size: 14px;
        }

        .table-container {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            background: white;
            max-height: 60vh;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--primary);
            color: white;
            padding: 10px;
            position: sticky;
            top: 0;
            font-size: 14px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        tr:hover {
            background: #eef2ff;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            gap: 10px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            flex: 1;
            text-align: center;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .loading {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            color: white;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: bold;
            z-index: 99;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Relatório de Chamados</h1>

        <form id="form-relatorio">
            <div class="filters">
                <div>
                    <label>Data Inicial *
                        <input type="date" name="data_inicial">
                    </label>
                </div>
                <div>
                    <label>Data Final *
                        <input type="date" name="data_final">
                    </label>
                </div>
                <div>
                    <label>Filtrar por</label><br>
                    <label><input type="radio" name="filtro_data" value="abertura" checked> Abertura</label>
                    <label><input type="radio" name="filtro_data" value="fechamento"> Fechamento</label>
                </div>
                <div>
                    <label>Filial
                        <input type="text" name="filial">
                    </label>
                </div>
                <div>
                    <label>Email
                        <input type="email" name="email">
                    </label>
                </div>
                <div>
                    <label>Empresa
                        <input type="text" name="empresa">
                    </label>
                </div>
                <div>
                    <label>Plataforma
                        <input type="text" name="plataforma">
                    </label>
                </div>
                <div>
                    <label>Título
                        <input type="text" name="titulo">
                    </label>
                </div>
            </div>
        </form>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Abertura</th>
                        <th>Fechamento</th>
                        <th>Filial</th>
                        <th>Email</th>
                        <th>Empresa</th>
                        <th>Plataforma</th>
                        <th>Título</th>
                    </tr>
                </thead>
                <tbody id="tbody-relatorio"></tbody>
            </table>
        </div>

        <div class="buttons">
            <button type="button" class="btn" onclick="gerarRelatorio()">Gerar Relatório</button>
            <button type="button" class="btn" onclick="exportarExcel()">Exportar Excel</button>
            <button type="button" class="btn" onclick="exportarExcelEmail()">Excel + E-mail</button>
        </div>
    </div>

    <div class="loading" id="loading">Gerando relatório...</div>

    <script src="{{ url_for('static', filename='js/gerar_relatorio.js') }}"></script>
</body>
</html>
